services:
  - type: web
    name: teamup
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: teamup-db
          property: connectionString

databases:
  - name: teamup-db
    plan: free
    databaseName: teamup
    user: teamup
